[project]
name = "ai-turkish-support-assistant"
version = "0.1.0"
description = "AI Turkish support assistant API for customer-support knowledge documents"
readme = "README.md"
authors = [
    { name = "Reza Hajizadeh", email = "33846853+rezaplus@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
